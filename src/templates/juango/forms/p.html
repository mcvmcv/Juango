{% if errors %}<ul class="errorlist nonfield">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
{% for field in fields %}{{ field.errors_html }}<p>{{ field.label_tag }} {{ field }}{% if field.help_text %} <span class="helptext">{{ field.help_text }}</span>{% endif %}</p>
{% endfor %}{% for field in hidden_fields %}{{ field }}{% endfor %}
