{% if errors %}<ul class="errorlist nonfield">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
{% for field in fields %}<div>{{ field.errors_html }}{{ field.label_tag }} {{ field }}{% if field.help_text %} <span class="helptext">{{ field.help_text }}</span>{% endif %}</div>
{% endfor %}{% for field in hidden_fields %}{{ field }}{% endfor %}
