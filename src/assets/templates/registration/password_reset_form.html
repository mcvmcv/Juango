<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password reset</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:28rem;margin:4rem auto;padding:0 1rem}input{font:inherit;padding:.4rem;width:100%;box-sizing:border-box}.errorlist{color:#b91c1c}</style></head>
<body>
<h1>Forgotten your password?</h1>
<p>Enter your email address below, and we’ll email instructions for setting a new one.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<p><button type="submit">Reset my password</button></p></form>
</body></html>
